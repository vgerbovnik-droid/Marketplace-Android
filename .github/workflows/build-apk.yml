name: Build Android APK and ZIP

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_DIR="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -z "$SDK_DIR" || ! -d "$SDK_DIR" ]]; then
            echo 'Android SDK is not installed on this runner' >&2
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          echo "Using Android SDK: $SDK_DIR"
          ls "$SDK_DIR"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f ./gradlew ]]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Package APK into ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          mapfile -d '' apks < <(find . -type f -path '*/build/outputs/apk/*' -name '*.apk' -print0)
          if (( ${#apks[@]} == 0 )); then
            echo 'No APK files found' >&2
            exit 1
          fi
          for apk in "${apks[@]}"; do
            cp "$apk" "dist/$(basename "$apk")"
          done
          (cd dist && zip -q "Marketplace-APK-build-${GITHUB_RUN_NUMBER}.zip" ./*.apk)

      - name: Upload ZIP and APK
        uses: actions/upload-artifact@v4
        with:
          name: Marketplace-build-${{ github.run_number }}
          path: |
            dist/*.zip
            dist/*.apk
          if-no-files-found: error
          retention-days: 30
